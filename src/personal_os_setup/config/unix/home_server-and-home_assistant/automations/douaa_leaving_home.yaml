# Douaa en quittant la maison.
#
# Déclencheur sur les entités person (pas sur les device_tracker) : une person
# regroupe le téléphone et le tracker routeur, donc un seul changement d'état
# par départ. Chaque personne reçoit la notification sur son propre téléphone.
# mode: parallel pour que deux départs rapprochés ne s'écrasent pas.
alias: 🤲 Douaa
description: >-
  Rappelle de réciter la douaa quand une personne quitte la maison
  (notification sur son propre téléphone).
triggers:
  - trigger: state
    id: amine
    entity_id: person.amine
    from: home
    to: not_home
  - trigger: state
    id: hannah
    entity_id: person.hannah
    from: home
    to: not_home
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: amine
        sequence:
          - action: notify.mobile_app_iphone_damine
            data:
              title: 🤲 Douaa
              message: "{{ trigger.to_state.name }}, récite la douaa en sortant de la maison"
      - conditions:
          - condition: trigger
            id: hannah
        sequence:
          - action: notify.mobile_app_iphone_dhana
            data:
              title: 🤲 Douaa
              message: "{{ trigger.to_state.name }}, récite la douaa en sortant de la maison"
mode: parallel
