packages:
  ubuntu:
    apt:
      Dev_tools:
        - docker-compose
      terminal_tools:
        - git
        - curl
        - zsh
        - wget
        - chezmoi # dotfile manager
        - bat # cat clone with syntax highlighting
        - fzf # fuzzy finder
        - btop # resource monitor (CPU/RAM/disk/net)
        - fastfetch # system info summary shown on shell startup
        - duf # disk usage/free utility, nicer than `df`
        - eza # modern ls replacement (successor to exa)
        - ripgrep # fast recursive grep, binary is `rg`
        - fd-find # fast find replacement; binary is installed as `fdfind`, not `fd`
        - tealdeer # fast tldr client (Rust), simplified example-based man pages
        - zoxide # smarter `cd` that learns your habits
        - tmux # terminal multiplexer
        - neovim # modernized vim

    webinstall:
      Dev_tools:
        - '[Docker](https://doc.ubuntu-fr.org/docker#depot_apt_docker)'

    snap:
      apps:
        - code

  darwin:
    brew:
      terminal_tools:
        - git
        - zsh
        - curl
        - chezmoi # dotfile manager
        - bat # cat clone with syntax highlighting
        - btop # resource monitor (CPU/RAM/disk/net)
        - duf # disk usage/free utility, nicer than `df`
        - dua-cli # fast interactive disk usage analyzer (Rust), binary is `dua`, replaces `du`
        - fastfetch # system info summary shown on shell startup
        - fzf # fuzzy finder
        - eza # modern ls replacement (successor to exa)
        - ripgrep # fast recursive grep, binary is `rg`
        - fd # fast find replacement
        - tealdeer # fast tldr client (Rust), simplified example-based man pages
        - zoxide # smarter `cd` that learns your habits
        - tmux # terminal multiplexer
        - neovim # modernized vim
    cask:
      AI:
        - ollama-app # https://github.com/ollama/ollama
        - chatgpt
        - anythingllm # All-in-one AI app https://github.com/Mintplex-Labs/anything-llm
        - https://github.com/MCPJam/inspector
      Browsers:
        - Brave-browser
        - Helium-browser

      Messaging:
        - Discord
        - WhatsApp
        - Viber
        - Telegram
      Meetings:
        - Zoom
        - microsoft-teams
      Media:
        - Stremio
        - VLC
      Gaming:
        -
      Drives:
        - Google-Drive

      Editing:
        - CapCut
        - Canva
      Text Editors:
        - Obsidian
        - Notion
      Dev_tools:
        - Pycharm
        - Ghostty
        - Zed
        - ComfyUI
        - Docker-Desktop

      Utilities:
        - Raycast # Launcher https://www.raycast.com/
        - Swift-Quit # quitting of macOS apps when closing their windows. https://github.com/onebadidea/swiftquit
        - Jordanbaird-ice # Menu bar management tool https://github.com/jordanbaird/Ice
        - Shottr # Screen capture tool https://shottr.cc/
        - Alt-Tab # Windows alt-tab on macOS https://github.com/lwouis/alt-tab-macos
        - AnyDesk
        - lihaoyun6/tap/quickrecorder # Screen recording tool https://github.com/lihaoyun6/QuickRecorder
        - nikitabobko/tap/aerospace # Tiling window manager https://github.com/nikitabobko/AeroSpace
        - badgeify # Apps in menu bar https://badgeify.app/
        - bing-wallpaper # Bing daily image as your wallpaper https://bingwallpaper.microsoft.com/

    webinstall:
      AI:
        - '[MCPJam Inspector](https://github.com/MCPJam/inspector/releases)'
      Text Editors:
        - '[PDFgear](https://www.pdfgear.com/pdfgear-for-mac/)'

  cachyos:
    pacman:
      Dev_tools:
        - claude-code
        - docker
        - docker-compose
        - meson # build system used by GNOME/many C/C++ projects
        - zed
        - ghostty
        - neovim # modernized vim

      terminal_tools:
        - git
        - curl
        - wget
        - zsh
        - base-devel
        - chezmoi # dotfile manager
        - make
        - cmake
        - bat # cat clone with syntax highlighting
        - fzf # fuzzy finder
        - eza # modern ls replacement (successor to exa)
        - ripgrep # fast recursive grep, binary is `rg`
        - fd # fast find replacement
        - tealdeer # fast tldr client (Rust), simplified example-based man pages
        - zoxide # smarter `cd` that learns your habits
        - btop # resource monitor (CPU/RAM/disk/net)
        - duf # disk usage/free utility, nicer than `df`
        - dua-cli # fast interactive disk usage analyzer (Rust), binary is `dua`, replaces `du`
        - fastfetch # replaces neofetch, which is deprecated upstream
        - tmux # terminal multiplexer
      Fonts:
        - ttf-jetbrains-mono-nerd # matches the JetBrainsMono Nerd Font used elsewhere in this project
      Browsers:
        - helium-browser-bin
        - brave-bin
      Gaming:
        - steam
      Messaging:
        - telegram-desktop
        - vesktop # Discord enhanced
      Media:
        - gwenview # KDE image viewer, integrates with Dolphin's preview pane and "Open With"
        - yt-dlp
        - mpv # lightweight, scriptable video/audio player, pairs well with WM keybinds
      Text Editors:
        - obsidian
      AI:
        - ollama
      Utilities:
        - bitwarden # password manager
        - qbittorrent # BitTorrent client
        - wine # runs Windows applications on Linux
        - partitionmanager # KDE Partition Manager, GUI disk/partition management
        - cachy-update # official CachyOS update notifier/applier with a systray applet (icon color signals pending updates); config in ~/.config/arch-update.conf
        - ventoy-bin # bootable-USB creator, drag-and-drop multiple ISOs without reflashing
      Files explorer:
        - nautilus # GNOME file manager, replaces Dolphin -- no KDE session deps (kwallet/kded/portals) to fight with under Hyprland
        - ghostty-nautilus # Adds Ghostty terminal for Nautilus context menu
        - gvfs # virtual filesystem backend Nautilus uses for all mounting (local disks, udisks2, trash, etc.)
        - gvfs-smb # Windows/SMB network share support (not pulled in by gvfs itself)
        - gvfs-mtp # Android phone (MTP) support
        - gvfs-gphoto2 # digital camera (PTP) support
        - gvfs-nfs # NFS network share support
        - gvfs-afc # iPhone/iPad support
        - gvfs-goa # cloud storage backend, pairs with gnome-online-accounts
        - gnome-online-accounts # Google/Microsoft/Nextcloud account integration for gvfs-goa
        - sushi # spacebar quick-preview for Nautilus (like macOS Quick Look)
        - nautilus-python # extension framework required by most python-based Nautilus plugins
      Hyprland desktop:
        - noctalia
        - nwg-look # GTK theme/icon/cursor/font configuration GUI for wlroots compositors
      Screenshots:
        - grim
        - slurp
        - satty
        - wl-clipboard
      Screen Recording:
        - gpu-screen-recorder-ui # fullscreen overlay UI in the style of ShadowPlay; pulls in gpu-screen-recorder + gpu-screen-recorder-notification as hard deps
      Hardware control (require reboot):
        - ddcutil # external monitor brightness over I2C
        - wlsunset # night light / blue light filter
        - brightnessctl
        - nwg-displays # GUI monitor configuration
        - wlopm # Wayland output power management (DPMS via wlr-output-power-management-v1); fixes NVIDIA treating native DPMS-off as a monitor disconnect
        - coolercontrol # fan/pump curves GUI after install: systemctl enable --now coolercontrold
        - openrgb # RGB lighting control
        - nvtop # GPU usage/VRAM/temp monitor, complements btop which doesn't show GPU stats
    paru:
      Hyprland desktop:
        - vicinae-bin # Raycast-style launcher https://vicinae.com
      Utilities:
        - anydesk-bin
        - nordvpn-bin
      Dev_tools:
        - pycharm # Unified edition
      Media:
        - mpv-uosc-git
        - mpv-thumbfast-git
        - mpv-sponsorblock-git
      Meetings:
        - zoom
      Hardware control (require reboot):
        - nct6687d-dkms-git
        - rivalcfg

  windows:
    winget:
      Browsers:
        - Brave.Brave
        - ImputNet.Helium
        - Mozilla.Firefox
        - Microsoft.Edge
        - Zen-Team.Zen-Browser
      Messaging:
        - Discord.Discord
        - WhatsApp.WhatsApp
        - Viber.Viber
        - Telegram.TelegramDesktop
      Meetings:
        - Zoom.Zoom
        - Microsoft.Teams

      Media:
        - Stremio.Stremio.Beta
        - VideoLAN.VLC
        - Feishin.Feishin
        - Spotify.Spotify
        - Apple.AppleMusic
      Gaming:
        - Valve.Steam
        - EpicGames.EpicGamesLauncher
        - Nvidia.GeForceExperience
        - Ubisoft.Connect
        - Meta.Oculus
        - SideQuestVR.SideQuest
      Drives:
        - Google.GoogleDrive
        - Microsoft.OneDrive
        - Apple.iCloud
      Editing:
        - OBSProject.OBSStudio
        - Meltytech.Shotcut
        - Canva.Canva
      Text Editors:
        - Obsidian.Obsidian
        - Notion.Notion
        - PDFgear.PDFgear
      Dev_tools:
        - Microsoft.WindowsTerminal
        - JetBrains.PyCharm
        - Comfy.ComfyUI-Desktop
        - Docker.DockerDesktop
        - Microsoft.VisualStudioCode
        - MongoDB.Compass.Full
        - ZedIndustries.Zed
        - GnuWin32.Make
      Devices Software:
        - Logitech.GHUB
        - Brother.iPrintScan
        - SteelSeries.GG

      Utilities:
        - glzr-io.glazewm
        - NordSecurity.NordVPN
        - qBittorrent.qBittorrent
        - Microsoft.PowerToys
        - ShareX.ShareX
        - Ookla.Speedtest.Desktop
        - Microsoft.BingWallpaper
        - File-New-Project.EarTrumpet
        - RevoUninstaller.RevoUninstaller
        - REALiX.HWiNFO
        - touchbyte.PhotoSync
        - AnyDesk.AnyDesk
        - BinaryFortress.DisplayFusion
        - RARLab.WinRAR
        - Hass.Agent
      Winget UI Manager:
        - MartiCliment.UniGetUI

    msstore:
      Devices Software:
        - MSI Center
      AI:
        - ChatGPT
      Utilities:
        - Wintoys
        - Raycast
        - Windows HDR Calibration
    webinstall:
      AI:
        - '[MCPJam Inspector](https://github.com/MCPJam/inspector/releases)'
      Devices Software:
        - '[Ryzen Master](https://www.amd.com/fr/products/software/ryzen-master.html#download)'
        - '[Turtle Beach](https://support.turtlebeach.com/s/downloads?language=fr#)'
