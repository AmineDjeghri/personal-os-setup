# Noctalia shell config (Layer 1) - state.toml is the GUI-managed layer that overrides this on conflict

[accessibility]
ui_scale = 1.20

[bar.default]
start = [ "vicinae", "lockscreen-edit", "blackbartblues/keymap:widget", "weather", "spacer_1", "group:g1" ]
center = [ "workspaces", "spacer_1", "active_window" , "media",]
end = [ "spacer_1", "privacy", "tray", "volume", "clock", "control-center", "notifications", "session" ]
concave_edge_corners = true
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
thickness = 35

[[bar.default.capsule_group]]
border = ""
fill = "on_secondary"
id = "g1"
members = [ "temp", "sysmon_2", "sysmon_3" ]
opacity = 1.0
padding = 6.0

[brightness]
enable_ddcutil = true
minimum_brightness = 0.5

[control_center]

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "keyboard_layout"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "nightlight"
[dock]
auto_hide = true
enabled = true
pinned = [ "helium", "com.mitchellh.ghostty", "org.gnome.Nautilus", "pycharm" ]
reserve_space = false
show_dots = true

[hooks]
session_locked = "noctalia msg media pause"
#session_unlocked = "noctalia msg media play"

[idle]
    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 600

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 1200


[location]
auto_locate = true

[lockscreen]
blurred_desktop = false

[lockscreen_widgets]
enabled = true

[nightlight]
enabled = true
force = true
temperature_day = 7000
temperature_night = 7000

[plugin_settings."nzlov/daily-wallpaper"]
locale = "fr-FR"

[plugins]
enabled = [ "nzlov/daily-wallpaper", "blackbartblues/keymap" ]

[shell]
clipboard_image_action_command = "satty -f -"
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "satty -f -"
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

    [[shell.session.actions]]
    action = "suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "6"
    variant = "default"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]
    community_ids = [ "vicinae" ]

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "celsius"

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.keyboard_layout]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.notifications]
color = "secondary"

[widget.privacy]
capsule = true
color = "secondary"
hide_inactive = true
scale = 1.05

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
display = "text"
glyph = "cpu-2"
show_label = true
stat = "cpu_temp"
type = "sysmon"

[widget.sysmon_2]
display = "text"
glyph = "gpu-usage"
show_label = true
stat = "gpu_usage"
type = "sysmon"

[widget.sysmon_3]
display = "text"
show_label = true
stat = "ram_pct"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.lockscreen-edit]
type = "custom_button"
glyph = "lock"
tooltip = "Edit lockscreen widgets"

    [widget.lockscreen-edit.actions]
    left = "exec noctalia msg lockscreen-widgets-toggle-edit"

[widget.vicinae]
type = "custom_button"
glyph = "search"
tooltip = "Vicinae"

    [widget.vicinae.actions]
    left = "exec vicinae toggle"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
display = "name"
inactive_pill_size = 1.0
pill_scale = 0.80
