name: Install Python Dependencies
description: Prepare uv, Make and the locked development environment on each platform
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        version: '0.13.5'
        enable-cache: true

    - name: Install Make (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: choco install make --no-progress --yes

    - name: Install Python Dependencies
      shell: bash
      env:
        UV_PYTHON: '3.14.8'
      run: make install-dev
