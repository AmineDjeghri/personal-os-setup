name: Install Python Dependencies
description: Prepare uv, Make and the locked development environment on each platform
inputs:
  save-cache:
    description: Save the uv cache after the job. Set to false when a parallel job on the same OS already saves the same key.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: '0.13.5'
        enable-cache: true
        save-cache: ${{ inputs.save-cache }}

    - name: Install Make (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: choco install make --no-progress --yes

    - name: Install Python Dependencies
      shell: bash
      env:
        UV_PYTHON: '3.14.8'
      run: make install-dev
