name: 'Install Python Dependencies'
description: 'Install uv and Python dependencies for the project'

runs:
  using: 'composite'
  steps:

    # Linux/macOS: the Makefile drives everything (install uv, then uv sync).
    - name: Install Python Dependencies
      if: runner.os != 'Windows'
      shell: bash
      run: |
        make install-uv
        make install-dev

    # Windows: windows-latest ships neither GNU make nor uv (see the runner-images manifest),
    # so install uv with the official action and run what `make install-dev` runs.
    # setup-uv has no floating major tag (only vX.Y.Z), so it must be pinned exactly.
    - name: Install uv (Windows)
      if: runner.os == 'Windows'
      uses: astral-sh/setup-uv@v10.3.0

    - name: Install Python Dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: uv sync --all-groups
