name: "👷 Quality Check & Tests"
on:
  workflow_call:
permissions:
  contents: read
jobs:
  pre-commit:
    name: "🧹 Pre-commit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-python-deps
      - run: make pre-commit
      - uses: ./.github/actions/cleanup-artifacts
        if: always()

  tests:
    name: "🧪 Self-contained (${{ matrix.os }})"
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-python-deps
      - name: Safe software checks with separate coverage reporting
        if: runner.os == 'Linux'
        run: make test-coverage
      - name: Safe software checks
        if: runner.os != 'Linux'
        run: make test-all
      - name: Upload self-contained coverage
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v6
        with:
          name: self-contained-coverage
          path: reports/coverage.xml
          if-no-files-found: warn
      - uses: ./.github/actions/cleanup-artifacts
        if: always()

  integration:
    name: "Integration (${{ matrix.os }})"
    needs: pre-commit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install-python-deps
      # Linux/macOS mutate only these disposable runners. Windows tests are read-only.
      - name: Run platform integration and require executed passing tests
        shell: bash
        run: make test-integration
      - uses: ./.github/actions/cleanup-artifacts
        if: always()

  validation:
    name: Required platform validation
    needs: [pre-commit, tests, integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report validation boundary
        shell: bash
        env:
          CHECKS: ${{ needs.pre-commit.result }}
          TESTS: ${{ needs.tests.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo 'CachyOS integration is not exercised by this hosted matrix. The Arch container is a manual sandbox.' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECKS" = success ] && [ "$TESTS" = success ] && [ "$INTEGRATION" = success ]; then
            echo 'Required hosted platform validation passed: static/docs hooks, self-contained checks and executed Ubuntu/macOS/Windows integration.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Required platform validation is incomplete. A local pass or a partially green run is insufficient.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
