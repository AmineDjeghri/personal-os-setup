# =============================================================================
# CI — Quality Checks
# =============================================================================
# Quality checks run on every push to a branch (main and dev are handled by the
# release workflows instead). Push-only on purpose: this used to also trigger on
# PRs, which ran the whole suite a second time for every push to a branch that
# has an open PR. The PR-title check needs the PR event payload, so it now
# lives in its own workflow, pr-title.yml, keeping this one push-only.
# =============================================================================
name: "👷 CI — Validate"
on:
  push:
    branches:
      - "**"
      - "!main" # handled by main-release.yml
      - "!dev" # handled by dev-release.yml
  workflow_dispatch: # manual re-run path; also the escape hatch for fork PRs (no push event)
concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  quality-check-and-tests:
    name: "👷 Quality Check & Tests"
    uses: ./.github/workflows/quality-and-tests.yml
    secrets: inherit  # pragma: allowlist secret
