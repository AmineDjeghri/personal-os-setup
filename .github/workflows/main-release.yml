name: "🚀 Release — Main"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  cancel-in-progress: false
  group: release-main
jobs:
  quality-checks:
    name: "👷 Quality Check & Tests"
    if: github.ref == 'refs/heads/main' && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]'))
    uses: ./.github/workflows/quality-and-tests.yml
    secrets: inherit  # pragma: allowlist secret

  release:
    name: Verified release publication
    needs: quality-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Remain on main so semantic-release can commit. RELEASE_SHA rejects a newer
          # untested tip; the exact metadata-only release commit is allowed on retries.
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/install-python-deps
      - name: Configure Git Bot Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Version, verify artifacts and finish or recover publication
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          GIT_COMMIT_AUTHOR: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        run: make release
      - uses: ./.github/actions/cleanup-artifacts
        if: always()

  docs:
    name: "📚 Deploy released documentation"
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.version }}
      - uses: ./.github/actions/install-python-deps
      - run: make deploy-doc-gh
      - uses: ./.github/actions/cleanup-artifacts
        if: always()

  summary:
    name: "📋 Summary"
    needs: [quality-checks, release, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report publication outcome
        shell: bash
        env:
          CHECKS: ${{ needs.quality-checks.result }}
          RELEASE: ${{ needs.release.result }}
          DOCS: ${{ needs.docs.result }}
          RELEASED: ${{ needs.release.outputs.released }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          if [ "$CHECKS" != success ]; then
            echo 'Release did not run: required validation failed or was skipped.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RELEASE" = success ] && [ "$RELEASED" = false ]; then
            echo 'No releasable commits since the last tag; nothing published.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RELEASE" = success ] && [ "$RELEASED" = true ] && [ "$DOCS" = success ]; then
            echo "Release v$VERSION and its documentation were published successfully." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Publication is incomplete. Check the failed job; rerun to resume verified asset uploads or documentation deployment.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
