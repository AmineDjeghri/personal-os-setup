# =============================================================================
# Dev Release (Candidate)
# =============================================================================
# Triggered on: push to dev or manual trigger
# =============================================================================
name: "🔶 Release — Dev"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions: # needed for semantic release and publishing releases
  contents: write
  id-token: write

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  quality-checks:
    name: "👷 Quality Check & Tests"
    # Skip if this is a sync merge from main (contains [skip ci]) or a release bump commit
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    uses: ./.github/workflows/quality-and-tests.yml
    secrets: inherit  # pragma: allowlist secret

  release:
    name: "🏷️ Candidate Version & Tag"
    runs-on: ubuntu-latest
    needs: quality-checks
    timeout-minutes: 5
    outputs:
      released: ${{ steps.semantic_release.outputs.released }}
      version: ${{ steps.semantic_release.outputs.version }}
    steps:
      - name: Check Out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}  # the branch tip: release-version checks it is in sync with origin

          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python Dependencies
        uses: ./.github/actions/install-python-deps

      - name: Configure Git Bot Identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: make release-version (release candidate, tag, GitHub prerelease)
        id: semantic_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_COMMIT_AUTHOR: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        shell: bash
        # Same target as a manual release (docs/developer/5.release.md): guards, semantic-release with
        # git hooks disabled for its own commit, outputs released/version.
        run: make release-version

      - name: make build-package
        if: steps.semantic_release.outputs.released == 'true'
        shell: bash
        run: make build-package

      - name: make release-assets
        if: steps.semantic_release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: make release-assets

      - name: Cleanup Artifacts
        if: always()
        uses: ./.github/actions/cleanup-artifacts

  summary:
    name: "📋 Summary"
    runs-on: ubuntu-latest
    needs: [quality-checks, release]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Generate Summary
        shell: bash
        run: |
          RELEASED="${{ needs.release.outputs.released }}"
          VERSION="${{ needs.release.outputs.version }}"
          QC="${{ needs.quality-checks.result }}"
          REL="${{ needs.release.result }}"

          status_icon() { if [ "$1" == "success" ]; then echo "✅"; elif [ "$1" == "skipped" ]; then echo "⏭️"; else echo "❌"; fi; }

          echo "## 🔶 Dev Release Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$REL" == "success" ]; then
            echo "> 🎉 **Candidate \`v$VERSION\` released successfully**" >> $GITHUB_STEP_SUMMARY
          elif [ "$REL" == "skipped" ]; then
            echo "> ℹ️ **No releasable commits** — nothing published." >> $GITHUB_STEP_SUMMARY
          else
            echo "> ⚠️ **Release failed** — check logs above." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🧹 Quality Checks | $(status_icon $QC) |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Candidate Release & Build | $(status_icon $REL) |" >> $GITHUB_STEP_SUMMARY
