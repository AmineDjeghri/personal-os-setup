[project]
name = "personal-os-setup"
version = "2.20.0"
description = "A terminal-based interactive app that helps you setup and enhance your OS."
readme = "README.md"
requires-python = ">=3.14,<3.16"
dependencies = [
    # Engineering
    "textual==8.2.8",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "loguru==0.7.3",
    "PyYAML==6.0.3",
    "build==1.6.1", # For building some aur packages like rivalcfg-gui
]

############### uv configuration
[tool.uv]
managed = true
default-groups = []

[dependency-groups]
# if you add new dependencies here, you can add them to [tool.uv] default-groups up above if you want to install them by default
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest-cov==7.1.0",
    "pre-commit==4.7.0",
    "ruff==0.17.2",
    "python-semantic-release==10.7.0",
]

docs = [
    "properdocs==1.6.7",
    "mkdocs-material==9.7.7",
    "mkdocstrings==1.0.8",
    "mkdocs-gen-files==0.6.1",
    "mkdocstrings-python==2.0.10",
    "mkdocs-same-dir==0.1.5",
    "mkdocs-exclude==1.0.2",
    "mkdocs-literate-nav==0.6.3",
]

# Build configuration to make this an installable package
[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_os_setup"]

## inside the root folder, you can run `uv run --directory . personal-os-setup` or directly personal-os-setup if the .venv is activated
[project.scripts]
personal-os-setup = "personal_os_setup.frontend.main:main"

#### pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/skills"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

############### ruff configuration
[tool.ruff]
# The chezmoi payload is deployed verbatim (shipped skills, dotfiles): ruff would reformat the
# python snippets inside those markdown files and silently change their meaning.
extend-exclude = ["src/personal_os_setup/config/**"]
line-length = 100
# Enable all `pydocstyle` rules, limiting to those that adhere to the Google convention via `convention = "google"`
lint.select = ["D", "F401"]
lint.ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "D417"]
lint.pydocstyle.convention = "google"



[tool.coverage.run]
source = ["personal_os_setup", "scripts"]
omit = ["src/personal_os_setup/config/*"]

[tool.coverage.report]
show_missing = true

# python-semantic-release configuration
[tool.semantic_release]
commit_parser = "scripts.emoji_commit_parser:EmojiAngularParser"
version_toml = ["pyproject.toml:project.version"]
version_pattern = "v(?P<version>\\d+\\.\\d+\\.\\d+(?:[-.]\\w+)?)"  # matches v1.0.0, v1.0.0-rc.1, etc.
# scripts/release.sh uses --no-vcs-release; verified assets are uploaded to a draft before publication.
# make release-version sets GIT_COMMIT_AUTHOR to your git identity; CI sets the bot.
commit_author = { env = "GIT_COMMIT_AUTHOR", default = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>" }
commit_message = "chore(release): v{version} [skip ci]"

# (python-semantic-release's uv integration guide).
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
make test-installation
"""

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

# ---------------------------------------------------------------------------
# Commit Convention:  [emoji] <type>[(<scope>)][!]: <description>
#
# Main Branch (production releases):
#   ✨ feat / feature          → minor bump  (1.0.0 → 1.1.0)
#   🐛 fix / bugfix / hotfix   → patch bump  (1.0.0 → 1.0.1)
#   ⚡️ perf                    → patch bump
#   💥 feat! / BREAKING CHANGE → major bump  (1.0.0 → 2.0.0)
#
# No Release (all branches):
#   ♻️ refactor  🧪 test  📝 docs  🎨 style  🔧 chore  👷 ci  📦 build
#
# Emoji prefix is optional. Both forms work:
#   "feat: add token refresh"
#   "✨ feat: add token refresh"
# ---------------------------------------------------------------------------

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat", "feature"]
patch_tags  = ["fix", "bugfix", "hotfix", "perf"]
allowed_tags = [
    "feat", "feature",
    "fix", "bugfix", "hotfix",
    "perf",
    "refactor",
    "chore",
    "ci",
    "docs",
    "style",
    "test",
    "build",
]
default_bump_level = 0

[tool.semantic_release.changelog]
# Patterns matched against the full raw commit subject — anchored with ^[^\w]*
# to handle optional leading emoji before the type keyword
exclude_commit_patterns = [
    '''^[^\w]*chore(\([^)]*\))?[!:]''',
    '''^[^\w]*ci(\([^)]*\))?[!:]''',
    '''^[^\w]*style(\([^)]*\))?[!:]''',
    '''^[^\w]*test(\([^)]*\))?[!:]''',
    '''^[^\w]*build(\([^)]*\))?[!:]''',
    '''^Merge ''',
    '''^Revert ''',
]

[tool.mypy]
plugins = ['pydantic.mypy', 'loguru_mypy']
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.commitizen]
name = "cz_customize"
tag_format = "v$version"
version_scheme = "semver"
encoding = "utf-8"

[tool.commitizen.customize]
# Supports optional leading emoji before the conventional commit type:
#   "feat: add thing"          ✅
#   "✨ feat: add thing"        ✅
#   "✨ feat(scope): add thing" ✅
#   "feat!: breaking"          ✅
schema_pattern = '(?s)^[^\w\n]*(feat|feature|fix|bugfix|hotfix|perf|refactor|docs|style|test|chore|ci|build)(\(\S+\))?!?:\ [^\n\r]+((\n\n.*)|(\s*))?$'
bump_pattern = '^(feat|feature|fix|bugfix|hotfix|perf)'
bump_map = {"feat" = "MINOR", "feature" = "MINOR", "fix" = "PATCH", "bugfix" = "PATCH", "hotfix" = "PATCH", "perf" = "PATCH"}
