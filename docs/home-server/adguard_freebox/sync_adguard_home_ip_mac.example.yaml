# Copy to ~/.config/adguard-sync/config.yaml and keep the real file OUT of git: it holds secrets.
# The last three keys are written by: freebox_auth.py fr.homeassistant.adguard_sync <this file>
#
# Direct AdGuard port (open it in the add-on configuration), not through Ingress.
# Try the credentials in the browser first. If AdGuard runs in Home Assistant, create a user for it and
# uncheck "local access only" for that user in Home Assistant.
adguard_url: http://<HAOS_IP>:8082
adguard_user: adguard
adguard_password: "PASSWORD"  # pragma: allowlist secret
freebox_url: http://192.168.1.254
app_id: fr.homeassistant.adguard_sync
app_token: "TOKEN_SAVED_BY_freebox_auth.py"  # pragma: allowlist secret
