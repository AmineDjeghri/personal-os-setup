config:
  default: true
  MD013: false            # line length
  MD033: false            # inline HTML (<br/>, md_in_html)
  MD046: false            # admonitions and tabs use indented blocks
  MD007:
    indent: 4             # Python-Markdown needs 4-space nested lists
  MD024:
    siblings_only: true
  MD014: false            # `$ command` examples
  MD029: false            # numbered steps split by code blocks keep their numbers
  MD041: false            # README starts with an HTML logo
  MD042: false            # README badges use `#` or empty links
  MD051: false            # MkDocs slugs differ from GitHub slugs; the strict build validates anchors
  MD060:
    style: aligned         # tables are padded to the header width so the source reads aligned
ignores:
  - ".github/**"
  - ".agents/**"
  - ".venv/**"
  - ".pytest_cache/**"
  - "**/node_modules/**"
  - "site/**"
  - "CHANGELOG.md"        # generated by semantic-release
  - "src/personal_os_setup/config/**"  # chezmoi templates and third-party skills (personal-os-setup only)
