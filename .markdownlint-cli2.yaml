config:
  default: true
  MD013: false            # line length
  MD033: false            # inline HTML (<br/>, md_in_html)
  MD046: false            # admonitions and tabs use indented blocks
  MD007: false            # existing docs nest lists with 2 spaces
  MD024:
    siblings_only: true
  MD014: false            # `$ command` examples
  MD029: false            # numbered steps split by code blocks keep their numbers
  MD051: false            # MkDocs slugs differ from GitHub slugs; the strict build validates anchors
  # Style-only rules disabled to keep the existing docs as they are
  MD001: false            # heading increments (README starts at h3 under the TOC)
  MD003: false            # heading style (setext vs atx)
  MD004: false            # unordered list marker
  MD005: false            # list indent consistency
  MD010: false            # hard tabs
  MD012: false            # multiple blank lines
  MD023: false            # heading must start at line start
  MD026: false            # trailing punctuation in headings
  MD027: false            # spaces after blockquote symbol
  MD028: false            # blank line between consecutive GitHub alerts (> [!TIP])
  MD030: false            # spaces after list markers
  MD034: false            # bare URLs
  MD036: false            # bold used as heading
  MD038: false            # spaces inside code spans
  MD039: false            # spaces inside link text
  MD056: false            # table column count
  MD059: false            # descriptive link text
ignores:
  - ".github/**"
  - ".venv/**"
  - "site/**"
  - "node_modules/**"
  - ".agents/**"
  - "CHANGELOG.md"        # generated by semantic-release
  - "src/personal_os_setup/config/**"  # chezmoi templates and third-party skills deployed to the user's home
